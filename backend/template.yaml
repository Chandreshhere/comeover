              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:irl/*
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ModerationTopic.TopicName
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
  ScheduledFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/jobs.scheduled
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
      Events:
        Lifecycle:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"task":"lifecycle"}'
        Retention:
          Type: Schedule
          Properties:
            Schedule: cron(30 21 * * ? *)
            Input: '{"task":"retention"}'

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Description: App user pool (phone OTP via CUSTOM_AUTH)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Mobile app client (no secret; ALLOW_CUSTOM_AUTH + ALLOW_REFRESH_TOKEN_AUTH)
    Value: !Ref UserPoolClient
  HttpApiUrl:
    Description: Base URL for every REST path in docs/API.md (already includes /v1)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1
  WebSocketUrl:
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  MediaBucket:
    Value: !Ref MediaBucket
  MediaCdnUrl:
    Description: Public CDN for avatar/* only
    Value: !Sub https://${MediaCdn.DomainName}
  CognitoDomain:
    Description: Hosted UI domain for the admin web (OAuth code + PKCE)
    Value: !Sub ${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminWebClientId:
    Value: !Ref AdminWebClient
  JobsQueueUrl:
    Value: !Ref JobsQueue
