AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Project IRL backend — API Gateway (HTTP + WebSocket), Lambda (Node.js 20),
  Cognito (app pool with phone OTP via CUSTOM_AUTH; admin pool with MFA + Hosted UI),
  RDS PostgreSQL/PostGIS via RDS Proxy (existing), S3 + CloudFront media, SQS jobs.
  GENERATED by scripts/build-template.js — edit infra/*.yaml or handlers, then `npm run template`.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with NAT egress (Cognito, SNS, Anthropic, Razorpay, Apple, Google APIs) that can reach the RDS Proxy.
  LambdaSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group(s) allowed to connect to the RDS Proxy on 5432.
  DbProxyEndpoint:
    Type: String
    Description: Existing RDS Proxy endpoint for the PostgreSQL (PostGIS) database.
  DbSecretArn:
    Type: String
    Description: Secrets Manager ARN with {username,password,host,port,dbname} used by the proxy.
  DbName:
    Type: String
    Default: irl
  CorsOrigins:
    Type: CommaDelimitedList
    Default: https://admin.projectirl.app
    Description: Browser origins allowed to call the HTTP API (admin web). Native apps don't need CORS.
  AdminCallbackUrls:
    Type: CommaDelimitedList
    Default: https://admin.projectirl.app/auth/callback,http://localhost:3000/auth/callback
  AdminLogoutUrls:
    Type: CommaDelimitedList
    Default: https://admin.projectirl.app/,http://localhost:3000/
  CognitoDomainPrefix:
    Type: String
    Default: projectirl-admin
    Description: Hosted UI domain prefix for the admin web (must be globally unique per region).
  AlertEmail:
    Type: String
    Description: Receives budget, DLQ and 5xx alarms.
  ModerationEmail:
    Type: String
    Description: Receives urgent safety report alerts.
  MonthlyBudgetUsd:
    Type: Number
    Default: 150
  AnthropicSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager secret named irl/* with {"apiKey":"..."} for the IRL Guide.
  RazorpayKeyId:
    Type: String
    Default: ''
  RazorpaySecretArn:
    Type: String
    Default: ''
    Description: irl/* secret with {"key_secret":"...","webhook_secret":"..."}.
  VenuePlanPriceInr:
    Type: Number
    Default: 999
  AppleIapSecretArn:
    Type: String
    Default: ''
    Description: irl/* secret with {"issuerId","keyId","privateKey"} for the App Store Server API.
  AppleBundleId:
    Type: String
    Default: com.projectirl.app
  AppleEnv:
    Type: String
    Default: Sandbox
    AllowedValues: [Sandbox, Production]
  AppleRootCaSha256:
    Type: String
    Default: ''
    Description: SHA-256 fingerprint of Apple Root CA - G3 (pins notification/transaction JWS chains).
  AndroidPackageName:
    Type: String
    Default: com.projectirl.app
  GoogleServiceAccountSecretArn:
    Type: String
    Default: ''
    Description: irl/* secret with the service-account JSON (Play Developer API + FCM).
  GoogleRtdnToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Shared token appended to the Pub/Sub push URL (?token=…) for Play RTDN.
  SmsSenderId:
    Type: String
    Default: ''
  SmsDltEntityId:
    Type: String
    Default: ''
    Description: India DLT principal entity id (required for SMS to +91).
  SmsDltTemplateId:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    CodeUri: .
    VpcConfig:
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: !Ref LambdaSecurityGroupIds
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        STAGE: !Ref Stage
        DB_PROXY_ENDPOINT: !Ref DbProxyEndpoint
        DB_SECRET_ARN: !Ref DbSecretArn
        DB_NAME: !Ref DbName
        MEDIA_BUCKET: !Ref MediaBucket
        MEDIA_CDN_URL: !Sub https://${MediaCdn.DomainName}
        JOBS_QUEUE_URL: !Ref JobsQueue
        WS_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
        ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_SECRET_ARN: !Ref RazorpaySecretArn
        VENUE_PLAN_PRICE_INR: !Ref VenuePlanPriceInr
        APPLE_IAP_SECRET_ARN: !Ref AppleIapSecretArn
        APPLE_BUNDLE_ID: !Ref AppleBundleId
        APPLE_ENV: !Ref AppleEnv
        APPLE_ROOT_CA_G3_SHA256: !Ref AppleRootCaSha256
        ANDROID_PACKAGE_NAME: !Ref AndroidPackageName
        GOOGLE_SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
        GOOGLE_RTDN_TOKEN: !Ref GoogleRtdnToken
        SMS_SENDER_ID: !Ref SmsSenderId
        SMS_DLT_ENTITY_ID: !Ref SmsDltEntityId
        SMS_DLT_TEMPLATE_ID: !Ref SmsDltTemplateId

Resources:
  # ---------------------------------------------------------------- Identity: app users (phone OTP)
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub irl-users-${Stage}
      UsernameAttributes: [phone_number]
      MfaConfiguration: 'OFF'
      Schema:
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 20
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeFunction.Arn
        PostAuthentication: !GetAtt PostAuthenticationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub irl-mobile-${Stage}
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      # LEGACY so InitiateAuth returns UserNotFoundException → client calls SignUp.
      # Enumeration risk is mitigated by per-phone/per-IP OTP rate limits.
      PreventUserExistenceErrors: LEGACY
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 90
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------- Identity: admin web (email + MFA, Hosted UI)
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub irl-admins-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${CognitoDomainPrefix}-${Stage}
      UserPoolId: !Ref AdminUserPool

  AdminWebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: !Sub irl-admin-web-${Stage}
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref AdminCallbackUrls
      LogoutURLs: !Ref AdminLogoutUrls
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Full access (KPIs, billing, taxonomy, moderation)
      UserPoolId: !Ref AdminUserPool

  ModeratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: moderator
      Description: Reports, activities, users and audit
      UserPoolId: !Ref AdminUserPool

  # ---------------------------------------------------------------- HTTP API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Auth:
        DefaultAuthorizer: AppAuth
        Authorizers:
          AppAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
          AdminAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}
              audience:
                - !Ref AdminWebClient

  # ---------------------------------------------------------------- Realtime (WebSocket)
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub irl-realtime-${Stage}
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${WsIntegration}
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WsIntegration}
  WsSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: subscribe
      Target: !Sub integrations/${WsIntegration}
  WsUnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: unsubscribe
      Target: !Sub integrations/${WsIntegration}
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${WsIntegration}

  WsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsSubscribeRoute, WsUnsubscribeRoute, WsDefaultRoute]
    Properties:
      ApiId: !Ref WebSocketApi

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      DeploymentId: !Ref WsDeployment
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt WsFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # ---------------------------------------------------------------- Media (private S3 + CloudFront for avatars only)
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: !Ref CorsOrigins
            AllowedHeaders: ['*']
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: abort-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 2
          - Id: bills-retention
            Status: Enabled
            Prefix: bill/
            ExpirationInDays: 400
          - Id: data-exports
            Status: Enabled
            Prefix: export/
            ExpirationInDays: 7

  MediaOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub irl-media-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AvatarOnlyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub irl-avatar-only-${Stage}
      AutoPublish: true
      FunctionConfig:
        Comment: Only avatars are publicly cacheable; everything else stays private (presigned).
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (uri.indexOf('/avatar/') !== 0 || uri.indexOf('..') !== -1) {
            return { statusCode: 403, statusDescription: 'Forbidden' };
          }
          return event.request;
        }

  MediaCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub irl media ${Stage}
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MediaOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: media
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AvatarOnlyFunction.FunctionMetadata.FunctionARN

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/avatar/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaCdn}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------- Jobs
  JobsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDLQ.Arn
        maxReceiveCount: 5

  # ---------------------------------------------------------------- Alerts, alarms, budget
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ModerationTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref ModerationEmail

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Jobs are failing repeatedly (dead-letter queue not empty)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API 5xx errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub irl-${Stage}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # ---------------------------------------------------------------- HTTP API Lambdas (generated)
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth.handler
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        PostV1AuthOtpRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/otp/request
            Auth:
              Authorizer: NONE
        PostV1AuthOtpVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/otp/verify
            Auth:
              Authorizer: NONE
        PostV1AuthSessionRefresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/session/refresh
            Auth:
              Authorizer: NONE
        PostV1AuthLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/logout
            Auth:
              Authorizer: NONE
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/profile.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminUserGlobalSignOut, cognito-idp:AdminDisableUser]
              Resource: !GetAtt UserPool.Arn
      Events:
        GetV1Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/me
        GetV1MeBootstrap:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/me/bootstrap
        PatchV1Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/me
        GetV1UsersUserIdPublicProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/users/{userId}/public-profile
        PatchV1MePreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/me/preferences
        DeleteV1Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /v1/me
        PostV1MeDataExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/me/data-export
        GetV1Notifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/notifications
        PostV1NotificationsReadAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/notifications/read-all
        PostV1NotificationsNotificationIdRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/notifications/{notificationId}/read
        PostV1Devices:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/devices
        DeleteV1DevicesToken:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /v1/devices/{token}
        PostV1MediaUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/media/upload-url
  DiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/discovery.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        GetV1Activities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/activities
        GetV1ActivitiesFeatured:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/activities/featured
        GetV1ActivitiesCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/activities/categories
        GetV1ActivitiesActivityId:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/activities/{activityId}
        PutV1MeAvailability:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /v1/me/availability
        GetV1AvailabilityNearby:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/availability/nearby
        GetV1MeActivities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/me/activities
        GetV1Search:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/search
        GetV1Venues:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/venues
        GetV1VenuesVenueId:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/venues/{venueId}
  ActivitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/activities.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        PostV1Activities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/activities
        PatchV1ActivitiesActivityId:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/activities/{activityId}
        PostV1ActivitiesActivityIdJoinRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/activities/{activityId}/join-requests
        GetV1ActivitiesActivityIdJoinRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/activities/{activityId}/join-requests
        DeleteV1ActivitiesActivityIdJoinRequestsMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /v1/activities/{activityId}/join-requests/me
        PostV1ActivitiesActivityIdJoinRequestsRequestIdAccept:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/activities/{activityId}/join-requests/{requestId}/accept
        PostV1ActivitiesActivityIdJoinRequestsRequestIdDecline:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/activities/{activityId}/join-requests/{requestId}/decline
        PostV1ActivitiesActivityIdCancel:
          Type: HttpApi
          Properties:
