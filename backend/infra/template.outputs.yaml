Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Description: App user pool (phone OTP via CUSTOM_AUTH)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Mobile app client (no secret; ALLOW_CUSTOM_AUTH + ALLOW_REFRESH_TOKEN_AUTH)
    Value: !Ref UserPoolClient
  HttpApiUrl:
    Description: Base URL for every REST path in docs/API.md (already includes /v1)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1
  WebSocketUrl:
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  MediaBucket:
    Value: !Ref MediaBucket
  MediaCdnUrl:
    Description: Public CDN for avatar/* only
    Value: !Sub https://${MediaCdn.DomainName}
  CognitoDomain:
    Description: Hosted UI domain for the admin web (OAuth code + PKCE)
    Value: !Sub ${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminWebClientId:
    Value: !Ref AdminWebClient
  JobsQueueUrl:
    Value: !Ref JobsQueue
