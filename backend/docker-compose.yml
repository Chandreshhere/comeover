# Local / single-host stack: API + MongoDB 7 as a single-node replica set
# (needed for multi-document transactions and change streams).
#
#   cp .env.example .env    # fill SLIDE_API_KEY, SLIDE_OTP_WIDGET_ID, JWT_SECRET …
#   docker compose up -d --build
#   docker compose exec api npm run seed
#   docker compose exec api npm run grant-role -- <your phone> admin
#
# In production point MONGODB_URI at MongoDB Atlas (replica set by default) and
# run only the `api` service (scale it horizontally; realtime fans out via change streams).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/irl?replicaSet=rs0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
